name: Build
on: workflow_dispatch
defaults:
  run:
    shell: bash
jobs:
  Build:
    strategy:
      matrix:
        os: [ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'  
      
      - run: go build -o helou -v .

      - run: echo "${{toJson(github)}}" > ghGh
      - run: echo "${{toJson(env)}}" > ghEnv

      - uses: actions/upload-artifact@v7
        with:
          path: ghEnv
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ghGh
          archive: false
