name: Build
on: workflow_dispatch
defaults:
  run:
    shell: bash
jobs:
  Build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'  
      
      - run: go build -o helou -v .

      - name: Download and install nfpm (x64)
        run: |
          wget -nv "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb"
          sudo dpkg -i nfpm_2.47.0_amd64.deb
        if: runner.arch == 'X64'

      - name: Download and install nfpm (arm64)
        run: |
          wget -nv "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_arm64.deb"
          sudo dpkg -i nfpm_2.47.0_arm64.deb
        if: runner.arch == 'ARM64'  

      - name: Create DEB package
        id: deb-create
        run: nfpm package -p deb

      - name: Create RPM package
        id: rpm-create
        run: nfpm package -p rpm

      - uses: actions/upload-artifact@v7
        with:
          path: helou
          archive: false
