name: Build
on: workflow_dispatch
defaults:
  run:
    shell: bash
jobs:
  Build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'  
      
      - run: go build -o helou -v .

      - name: Download nfpm
        run: wget "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_$(arch).deb"
