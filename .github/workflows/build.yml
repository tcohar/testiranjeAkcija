name: Build
on: workflow_dispatch
defaults:
  run:
    shell: bash
jobs:
  Build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install prerequisites
        run: sudo apt-get -y install libgtk-3-dev libcairo2-dev libglib2.0-dev libayatana-appindicator3-dev

      - run: go build -o helou -v .

      - name: Download and install nfpm
        run: |
          ARCH=${{ case( runner.arch == 'X64', 'amd64', runner.arch == 'ARM64', 'arm64', '' ) }}
          wget -nv "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_${ARCH}.deb"
          sudo dpkg -i nfpm_2.47.0_${ARCH}.deb

      - name: Create DEB package
        id: deb-create
        run: |
          PKG_PATH=$(nfpm package -p deb | grep "created package" | sed 's/created package: //g')
          echo "path=${PKG_PATH}"
          echo "path=${PKG_PATH}" >> $GITHUB_OUTPUT
        env:
          GOARCH: ${{ case( runner.arch == 'ARM64', 'arm64', 'amd64') }}

      - name: Create RPM package
        id: rpm-create
        run: |
          PKG_PATH=$(nfpm package -p rpm | grep "created package" | sed 's/created package: //g')
          echo "path=${PKG_PATH}"
          echo "path=${PKG_PATH}" >> $GITHUB_OUTPUT
        env:
          GOARCH: ${{ case( runner.arch == 'ARM64', 'arm64', 'amd64') }}

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.deb-create.outputs.path }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.rpm-create.outputs.path }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: helou
          archive: false
